<!doctype html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>OmniOS</title>
<style>
:root{--bg:#f4f6f9;--sf:#fff;--ink:#0e1a2b;--mu:#5b6472;--ln:#d8dde6;--ac:#2347a8;--acs:#e6ecfb;--ok:#17693f;--oks:#e3f4ea;--wn:#8a4700;--wns:#fcefdc;--er:#9b2226;--ers:#fbe7e8;--code:#0f1b2e;--codeink:#dce6fa;--r:10px}

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 system-ui,'Segoe UI',Roboto,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
header{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;padding:10px 16px;background:var(--sf);border-bottom:1px solid var(--ln);position:sticky;top:0;z-index:5}
.logo{font-weight:800;letter-spacing:.02em;font-size:18px}
.logo small{font-weight:500;color:var(--mu);margin-left:8px;font-size:13px}
.sp{flex:1}
nav{display:flex;gap:4px;flex-wrap:wrap;padding:8px 16px;background:var(--sf);border-bottom:1px solid var(--ln)}
nav button{border:0;background:none;padding:8px 14px;border-radius:8px;cursor:pointer;color:var(--mu);font-weight:600}
nav button.on{background:var(--acs);color:var(--ac)}
main{max-width:1180px;margin:0 auto;padding:18px 16px 60px}
h1{font-size:22px;margin:0 0 4px}h2{font-size:17px;margin:24px 0 8px}h3{font-size:14px;margin:16px 0 6px;color:var(--mu);text-transform:uppercase;letter-spacing:.06em}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:var(--r);padding:14px 16px}
.grid{display:grid;gap:12px}.g2{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}.g4{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.kpi b{display:block;font-size:26px;line-height:1.2}.kpi span{color:var(--mu);font-size:13px}
.mu{color:var(--mu)}.small{font-size:13px}.mono{font-family:ui-monospace,Consolas,monospace;font-size:12.5px;word-break:break-all}.idc{white-space:nowrap;word-break:normal}
.chip{display:inline-block;padding:2px 9px;border-radius:12px;font-size:12px;font-weight:700;white-space:normal;max-width:190px}
.s-warn{background:var(--wns);color:var(--wn)}.s-ac{background:var(--acs);color:var(--ac)}.s-ok{background:var(--oks);color:var(--ok)}.s-er{background:var(--ers);color:var(--er)}.s-mu{background:var(--bg);color:var(--mu);border:1px solid var(--ln)}
.btn{border:1px solid var(--ln);background:var(--sf);padding:7px 14px;border-radius:8px;cursor:pointer;font-weight:600}
.btn:hover{border-color:var(--ac)}.btn.pri{background:var(--ac);border-color:var(--ac);color:#fff}.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}.btn.er{background:var(--er);border-color:var(--er);color:#fff}.btn[disabled]{opacity:.45;cursor:not-allowed}
@media(prefers-color-scheme:dark){.btn.pri,.btn.ok,.btn.er{color:#06101f}}
input,select,textarea{background:var(--sf);border:1px solid var(--ln);border-radius:8px;padding:7px 10px;width:100%}
textarea{font-family:ui-monospace,Consolas,monospace;font-size:13px;min-height:130px}
label{display:block;font-size:13px;color:var(--mu);margin:10px 0 3px}
table{border-collapse:collapse;width:100%;font-size:14px}th,td{border-bottom:1px solid var(--ln);padding:7px 8px;text-align:left;vertical-align:top}th{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--mu)}
tr.row{cursor:pointer}tr.row:hover td{background:var(--acs)}tr.sel td{background:var(--acs)}
pre{background:var(--code);color:var(--codeink);padding:12px;border-radius:8px;overflow:auto;font-size:12.5px;margin:6px 0;max-height:320px}
.split{display:grid;grid-template-columns:minmax(300px,420px) 1fr;gap:14px;align-items:start}@media(max-width:860px){.split{grid-template-columns:1fr}}
.help{background:var(--acs);border:1px solid var(--ln);border-radius:var(--r);padding:10px 14px;margin:0 0 14px}.help summary{cursor:pointer;font-weight:700;color:var(--ac)}.help p{margin:8px 0 0}
.tw{overflow-x:auto}.bar{display:flex;gap:4px;margin:6px 0}.bar i{flex:1;height:8px;border-radius:4px;background:var(--ln)}.bar i.f{background:var(--ok)}
.tl{margin:0;padding-left:18px}.tl li{margin:3px 0}
.check{display:flex;gap:8px;margin:4px 0;align-items:flex-start}.check b{width:18px;text-align:center}.c-ok b{color:var(--ok)}.c-er b{color:var(--er)}.c-na b{color:var(--wn)}
.toast{position:fixed;right:14px;bottom:14px;max-width:420px;background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:10px;z-index:20;box-shadow:0 6px 24px #0005}
.login{max-width:520px;margin:8vh auto;padding:0 16px}
.demo{display:flex;gap:6px;flex-wrap:wrap}.demo button{padding:4px 10px;font-size:13px}
.warnbox{background:var(--wns);color:var(--wn);border-radius:8px;padding:8px 12px;font-size:13px;margin:8px 0}
.keybox{background:var(--oks);color:var(--ok);border-radius:8px;padding:10px 12px;margin:8px 0}
</style>
</head>

function toast(msg, bad){ const el=document.getElementById("toast"); el.textContent=msg; el.style.display="block"; el.style.background = bad ? "var(--er)" : "var(--ink)"; clearTimeout(toast.t); toast.t=setTimeout(()=>el.style.display="none", bad?7000:3000); }
async function api(path, opt={}){
  const h = Object.assign({"Accept":"application/json"}, opt.headers||{}); if(S.key) h["X-API-Key"]=S.key;
  let body; if(opt.json!==undefined){ h["Content-Type"]="application/json"; body=JSON.stringify(opt.json); }
  const r = await fetch(path, {method:opt.method||(body?"POST":"GET"), headers:h, body});
  if(opt.blob && r.ok) return r.blob();
  let d=null; try{ d=await r.json(); }catch(e){}
  if(!r.ok){ const det=d&&d.detail; const msg = det ? (typeof det==="string"?det:(det.code? det.code+(det.detail?": "+det.detail:""):JSON.stringify(det))) : "HTTP "+r.status; const e=new Error(msg); e.status=r.status; throw e; }
  return d;
}
async function act(fn){ try{ await fn(); }catch(e){ if(e.status===401){ logout(); } toast(t("err")+": "+e.message, true); } }

  const [ov,pol,acts] = await Promise.all(p);

  if(S.sel){ try{ S.selData = await api("/v1/actions/"+S.sel); }catch(e){ S.selData=null; } }

async function loadEvidence(){ await act(async()=>{ S.ev = await api("/v1/audit/evidence/"+S.sel); S.vres=null; render(); }); }
const enc = new TextEncoder();
const cat = (...a) => { let n=0; a.forEach(x=>n+=x.length); const o=new Uint8Array(n); let i=0; a.forEach(x=>{o.set(x,i); i+=x.length;}); return o; };
const sha = async u8 => new Uint8Array(await crypto.subtle.digest("SHA-256", u8));
const hex = u => [...u].map(b=>b.toString(16).padStart(2,"0")).join("");
const unhex = s => Uint8Array.from((s.match(/../g)||[]).map(h=>parseInt(h,16)));
const unb64 = s => Uint8Array.from(atob(s), c=>c.charCodeAt(0));
const eq = (a,b) => a.length===b.length && a.every((x,i)=>x===b[i]);
async function verifyInclusion(leaf, index, size, proof, root){
  if(!(index>=0 && index<size)) return false;
  let fn=index, sn=size-1, r=leaf;
  for(const p of proof){
    if(sn===0) return false;
    if((fn&1) || fn===sn){ r = await sha(cat(Uint8Array.of(1), p, r)); if(!(fn&1)){ while(!(fn&1) && fn!==0){ fn>>=1; sn>>=1; } } }
    else { r = await sha(cat(Uint8Array.of(1), r, p)); }
    fn>>=1; sn>>=1;
  }
  return sn===0 && eq(r,root);
}
async function verifyEvidence(){
  const ev=S.ev, out=[], pin=(document.getElementById("pin")||{}).value?.trim();
  const add=(ok,msg)=>out.push({ok,msg});
  const cp=ev.checkpoint; const root=unb64(cp.root), size=ev.size;
  const note=cp.note, i=note.indexOf("\n\n"), body=note.slice(0,i+1);
  const lines=body.split("\n");
  add(lines[1]==String(size) && lines[2]===cp.root, lang==="el"?"Το checkpoint δηλώνει μέγεθος "+size+" και τη ρίζα που βλέπεις":"The checkpoint states size "+size+" and the root shown");
  for(const r of ev.records){
    const raw=enc.encode(r.body); const leaf=await sha(cat(Uint8Array.of(0), raw));
    add(hex(leaf)===r.leaf, (lang==="el"?"Εγγραφή ":"Record ")+r.seq+" ("+r.type+"): "+(lang==="el"?"το κείμενο δίνει το hash που περιέχει το δέντρο":"the text hashes to the leaf in the tree"));
    const ok=await verifyInclusion(leaf, r.seq, size, r.inclusion.map(unhex), root);
    add(ok, (lang==="el"?"Εγγραφή ":"Record ")+r.seq+": "+(lang==="el"?"ανήκει στο δέντρο που υπογράφεται (απόδειξη συμμετοχής RFC 9162)":"belongs to the signed tree (RFC 9162 inclusion proof)"));
  }
  const pubB64 = pin || cp.log_public_key;
  try{
    const sigLine=note.slice(i+2).split("\n").find(l=>l.startsWith("— "));
    const payload=unb64(sigLine.split(" ").pop());
    const key=await crypto.subtle.importKey("raw", unb64(pubB64), {name:"Ed25519"}, false, ["verify"]);
    const ok=await crypto.subtle.verify("Ed25519", key, payload.slice(4), enc.encode(body));
    add(ok, lang==="el"?"Η ρίζα είναι υπογεγραμμένη από το κλειδί "+(pin?"που έδωσες":"του server (ΟΧΙ ανεξάρτητο)"):"The root is signed by the key "+(pin?"you provided":"given by the server (NOT independent)"));
    if(!pin) add(null, lang==="el"?"Χωρίς κλειδί από άλλη διαδρομή, αυτό δεν αποδεικνύει ποιος τρέχει το log.":"Without a key obtained another way, this does not prove who runs the log.");
  }catch(e){ add(null, lang==="el"?"Η υπογραφή δεν ελέγχθηκε (ο browser ίσως δεν υποστηρίζει Ed25519): "+e.message:"Signature not checked (this browser may not support Ed25519): "+e.message); }
  S.vres=out; render();
}

  const pr = (S.princ||[]).map(p=>`<tr><td>${esc(p.name)}</td><td>${esc(roleName(p.role))}</td><td class="small">${esc((p.groups||[]).join(", "))}</td><td class="small">${esc((p.permissions||[]).join(", "))}</td></tr>`).join("");
  const nk = S.newKey ? `<div class="keybox">${t("keyonce")} <b>${esc(S.newKey.name)}</b><div class="mono">${esc(S.newKey.key)}</div></div>`:"";
  return `${help("hint_rules")}
  <h2 style="margin-top:0">${t("tools")} <span class="small mu">· v${S.pol.version.n} · <span class="mono">${esc(short(S.pol.policy_hash,12))}</span></span></h2>
  <div class="card"><table><thead><tr><th>${t("tool")}</th><th>${t("perm")}</th><th>${t("reversib")}</th><th>${t("risk")}</th><th>${t("reqapp")}</th></tr></thead><tbody>${rows}</tbody></table></div>
  ${["admin","auditor"].includes(role)? `<h2>${t("changes")}</h2><div class="card">${chg? `<table><thead><tr><th>id</th><th>${t("type")}</th><th>${t("proposer")}</th><th>${t("status")}</th><th></th></tr></thead><tbody>${chg}</tbody></table>`:`<span class="mu">${t("nochg")}</span>`}</div>
   <h2>${t("principals")}</h2><div class="card"><table><thead><tr><th>${t("name")}</th><th>${t("role")}</th><th>${t("groups")}</th><th>${t("perm")}</th></tr></thead><tbody>${pr}</tbody></table></div>`:""}
  ${admin? `${nk}<div class="grid g2"><div class="card"><b>${t("propkey")}</b>
    <label>${t("name")}</label><input id="pk_name"><label>${t("role")}</label><select id="pk_role"><option>approver</option><option>agent</option><option>admin</option><option>auditor</option></select>
    <label>${t("groups")}</label><input id="pk_groups"><label>${t("perms")}</label><input id="pk_perms"><p><button class="btn pri" onclick="proposeKey()">${t("propose")}</button></p></div>
   <div class="card"><b>${t("proppol")}</b><textarea id="poltext" style="min-height:260px" oninput="S.polText=this.value">${esc(S.polText||"")}</textarea><p><button class="btn" onclick="validatePolicy()">${t("validate")}</button> <button class="btn pri" onclick="proposePolicy()">${t("propose")}</button></p></div></div>`:""}`;
}
function vGuide(){
  const steps=[1,2,3,4,5,6].map(n=>`<div class="card"><b>${t("g"+n+"t")}</b><p style="margin:6px 0 0">${esc(t("g"+n))}</p></div>`).join("");
  return `${help("hint_guide")}<div class="grid g2">${steps}</div><div class="warnbox" style="margin-top:14px"><b>${t("g7t")}</b><br>${esc(t("g7"))}</div>`;
}
const VCHIP = {allow:["s-ok","obs_allowed"], pending:["s-warn","obs_wait"], deny:["s-er","obs_refused"]};
const vchip = d => `<span class="chip ${(VCHIP[d]||["s-mu",""])[0]}">${esc(t((VCHIP[d]||[0,"obs_verdict"])[1]))}</span>`;
function vObs(){
  const role=S.me.role;
  const warn=`<div class="warnbox" style="margin-top:14px">${esc(t("obs_limits"))}</div>`;
  if(role==="agent"){
    const tools=Object.keys(S.pol.policy.tools||{}), mine=S.obsMine||[];
    const rows=mine.length? mine.map(o=>`<tr><td class="mono idc">${esc(o.id)}</td><td>${esc(o.tool)}</td><td>${vchip(o.decision)}${o.decision==="pending"?` <span class="small mu">${o.approvals_required}</span>`:""}</td><td class="small">${esc((o.reasons||[]).slice(0,2).join("; "))}</td></tr>`).join("") : `<tr><td colspan="4" class="mu">${t("obs_none")}</td></tr>`;
    return `${help("hint_obs")}<div class="split"><div class="card"><b>${t("obs_send")}</b>
      <label>${t("tool")}</label><input id="ottool" list="otl" value="${esc(tools[0]||"")}" onchange="fillObsSample()"><datalist id="otl">${tools.map(x=>`<option value="${esc(x)}">`).join("")}</datalist>
      <label>${t("params")}</label><textarea id="otparams" style="min-height:70px">${esc(OBS_SAMPLE[tools[0]]||"{}")}</textarea><p><button class="btn pri" onclick="sendObs()">${t("send")}</button></p></div>
      <div class="card tw"><b>${t("obs_mine")}</b><table><tbody>${rows}</tbody></table></div></div>${warn}`;
  }
  const s=S.obs;
  if(!s || !s.total) return `${help("hint_obs")}<div class="card mu">${t("obs_none")}</div>${warn}`;
  const tools=Object.entries(s.by_tool).map(([n,v])=>`<tr><td>${esc(n)}</td><td>${v.total}</td><td>${v.allow}</td><td>${v.pending}</td><td>${v.deny}</td></tr>`).join("");
  const um=Object.entries(s.unmapped_tools).map(([n,c])=>`<li><b>${esc(n)}</b> <span class="mu">(${c})</span></li>`).join("");
  const why=s.top_reasons.map(r=>`<li>${esc(r.reason)} <span class="mu">(${r.count})</span></li>`).join("");
  const att=s.attention.map(a=>`<tr><td class="mono idc">${esc(a.id)}</td><td>${esc(a.tool)}</td><td>${vchip(a.decision)}${a.decision==="pending"?` <span class="small mu">${a.approvals_required}</span>`:""}</td><td class="small">${fmt(a.at)}</td><td class="small">${esc(a.reasons.join("; "))}</td></tr>`).join("");
  return `${help("hint_obs")}
   <div class="grid g4">
    <div class="card kpi"><b>${s.total}</b><span>${t("obs_total")}</span></div>
    <div class="card kpi"><b style="color:var(--ok)">${s.allow}</b><span>${t("obs_allow")}</span></div>
    <div class="card kpi"><b style="color:var(--wn,#b45f06)">${s.pending}</b><span>${t("obs_pend")}</span></div>
    <div class="card kpi"><b style="color:var(--er)">${s.deny}</b><span>${t("obs_deny")}</span></div></div>
   <p><b>${Math.round(s.needs_review_share*100)}%</b> ${t("obs_share")}. <button class="btn" onclick="openObsReport()">${t("obs_report")}</button></p>
   ${um?`<div class="warnbox"><b>${t("obs_unmapped")}</b><ul class="tl">${um}</ul></div>`:""}
   ${s.unreadable_input?`<p class="small"><b>${s.unreadable_input}</b> ${t("obs_unread")}</p>`:""}
   <h2>${t("obs_bytool")}</h2><div class="card tw"><table><thead><tr><th>${t("tool")}</th><th>Σ</th><th>${t("obs_allowed")}</th><th>${t("obs_wait")}</th><th>${t("obs_refused")}</th></tr></thead><tbody>${tools}</tbody></table></div>
   <h2>${t("obs_why")}</h2><ul class="tl">${why||"<li class=mu>–</li>"}</ul>
   <h2>${t("obs_first")}</h2><div class="card tw"><table><thead><tr><th>id</th><th>${t("tool")}</th><th>${t("obs_verdict")}</th><th>${t("obs_when")}</th><th>${t("reasons")}</th></tr></thead><tbody>${att||`<tr><td colspan=5 class=mu>–</td></tr>`}</tbody></table></div>${warn}`;
}
function render(){
  const app=document.getElementById("app"); document.documentElement.lang=lang;
  if(!S.me){
    app.innerHTML=`<div class="login"><h1>OmniOS</h1><p class="mu">${t("appsub")}</p>
     <div class="card"><label>${t("keyph")}</label><input id="kin" type="password" autocomplete="off" onkeydown="if(event.key==='Enter')login(this.value)"><p><button class="btn pri" onclick="login(document.getElementById('kin').value)">${t("enter")}</button> <button class="btn" onclick="setLang()">${t("lang")}</button></p><p class="small mu">${t("loginhelp")}</p></div>
     ${S.demo.length?`<h3>${t("demokeys")}</h3><div class="demo">${S.demo.map((d,i)=>`<button class="btn" onclick="login(S.demo[${i}].key)">${esc(d.label||d.name)}</button>`).join("")}</div>`:""}</div>`;
    return;
  }
  const tabs=[["over","t_over"],["act","t_act"],["led","t_led"],["rules","t_rules"],["obs","t_obs"],["guide","t_guide"]];
  const view = {over:vOver, act:vActs, led:vLedger, rules:vRules, obs:vObs, guide:vGuide}[S.tab]();
  app.innerHTML=`<header><span class="logo">OmniOS<small>${t("appsub")}</small></span><span class="sp"></span>
    ${S.demo.length?`<span class="demo">${S.demo.map((d,i)=>`<button class="btn ${d.key===S.key?"pri":""}" onclick="login(S.demo[${i}].key)">${esc(d.label||d.name)}</button>`).join("")}</span>`:""}
    <span class="chip s-ac">${esc(S.me.name)} · ${esc(roleName(S.me.role))}${S.me.groups&&S.me.groups.length?" · "+esc(S.me.groups.join(",")):""}</span>
    <button class="btn" onclick="setLang()">${t("lang")}</button><button class="btn" onclick="logout()">${t("logout")}</button></header>
   <nav>${tabs.map(([k,l])=>`<button class="${S.tab===k?"on":""}" onclick="go('${k}')">${t(l)}${k==="act"&&S.ov?` (${(S.ov.counts||{}).PENDING_APPROVAL||0})`:""}</button>`).join("")}<span class="sp"></span><button class="btn" onclick="act(refresh)">↻</button></nav>
   <main>${view}</main>`;
}
async function go(tab){ S.tab=tab; await act(async()=>{ if(tab==="led") await loadLedger(true); if(tab==="rules") await loadRules(true); if(tab==="obs") await loadObs(true); render(); }); }
function setLang(){ lang = lang==="el"?"en":"el"; try{ localStorage.setItem("omnios_lang",lang); }catch(e){} render(); }

/* ───────────── start ───────────── */
(async function(){
  await tryDemo();
  let k=null; try{ k=sessionStorage.getItem("omnios_key"); }catch(e){}
  if(k) await login(k); else render();
  setInterval(()=>{ if(S.me && S.tab!=="rules" && document.visibilityState==="visible" && !document.activeElement?.matches("input,textarea,select") && !(document.getElementById("cmt")||{}).value) refresh().catch(()=>{}); }, 6000);
})();
</script>
</body>
</html>
